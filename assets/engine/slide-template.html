</head><body><div id="quadro"></div>
<script>
// Slide NN · [posição] · [dispositivo] · [duração] s. Estático: monte o quadro 0. Vivo: seek(t) move e volta ao repouso.
const K = KIT, A = KIT.A;
K.marca({ unidade: 'UNIDADE DE NEGÓCIO' }); // Consultores Associados | Marketing Digital | Eventos
KIT.pronto(() => {
  const q = document.getElementById('quadro');
  K.fundoPapel(q);                                  // ou K.fundoMarinho(q) · ou q.className = 'foto' + camadas
  const P = (window.__pecas = {});
  P.titulo = K.el(q, 'div', 'abs sans', 'palavra', { color: K.cor('tinta') });
  K.place(P.titulo, { x: 72, base: 420, fs: 220 }); K.fit(P.titulo, 936);
  K.rodape(q, K.cor('tinta'));
  // vivo: window.seek = (t) => { ... A.carimbo(t, 1.0) ... };
  K.slide({ index: 1, duration: 6, cues: [/* { t: 1.0, tipo: 'impacto', o_que: 'título carimba' } */] });
});
</script></body></html>
